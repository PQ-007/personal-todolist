<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1322" />
    <meta name="description" content="Weekly planner backed by Google Calendar" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Calpis — planner</title>
    <meta name="application-name" content="Calpis" />
    <meta name="apple-mobile-web-app-title" content="Calpis" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { if (localStorage.getItem('planner_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
